name: collect-data

on:
  schedule:
    - cron: "17 1 * * *" # daily 01:17 UTC (09:17 Beijing)
  push:
    # Re-run when the collectors change; data commits (docs/data) don't match, so no loop.
    paths:
      - "scripts/**"
      - ".github/workflows/collect.yml"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild history from upstream git histories before collecting"
        type: choice
        default: none
        options: [none, skypilot, litellm, openrouter-usage, all]

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Backfill history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill != 'none' }}
        env:
          WHAT: ${{ inputs.backfill }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/backfill.py "$WHAT"

      - name: Collect today's data
        env:
          # Optional: free key from openrouter.ai/settings/keys for same-day usage data.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +%F)"
          git pull --rebase
          git push
