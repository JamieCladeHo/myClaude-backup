name: collect-data

on:
  schedule:
    - cron: "17 1 * * *" # daily 01:17 UTC (09:17 Beijing)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild history from upstream git histories before collecting"
        type: choice
        default: none
        options: [none, skypilot, litellm, all]

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backfill history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill != 'none' }}
        env:
          WHAT: ${{ inputs.backfill }}
        run: python scripts/backfill.py "$WHAT" --since 2024-01-01 --step 7

      - name: Collect today's data
        run: python scripts/collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +%F)"
          git pull --rebase
          git push
